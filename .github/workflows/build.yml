name: Build desktop apps
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: windows-x86_64
          - runner: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libx11-6 libxext6 libxrender1 libxft2
      - run: python -m pip install -r requirements-build.txt
      - name: Compile source
        run: python -m compileall -q core windows mac linux pulchra.py build.py
      - name: Test source on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python pulchra.py --smoke-test
      - run: python build.py
      - name: Test packaged Linux executable
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/Pulchra/Pulchra --smoke-test
      - name: Test packaged Mac executable
        if: runner.os == 'macOS'
        run: dist/Pulchra.app/Contents/MacOS/Pulchra --smoke-test
      - name: Test packaged Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Pulchra/Pulchra.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged smoke test failed ($($p.ExitCode))" }
      - name: Archive
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, subprocess, zipfile
          target = os.environ["TARGET"]
          pathlib.Path("packages").mkdir(exist_ok=True)
          if target == "macos-arm64":
              subprocess.run(["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent",
                              "dist/Pulchra.app", f"packages/Pulchra-{target}.zip"], check=True)
          else:
              import shutil
              shutil.make_archive(f"packages/Pulchra-{target}", "zip", "dist", "Pulchra")
      - uses: actions/upload-artifact@v4
        with:
          name: Pulchra-${{ matrix.target }}
          path: packages/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" packages/*.zip --title "$TAG" --generate-notes
